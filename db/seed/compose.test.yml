services:
  db:
    image: postgres:16-alpine
    container_name: atuel_pg16_carga_test
    restart: "no"
    environment:
      POSTGRES_DB: atuel_base_test
      POSTGRES_USER: atuel_admin
      POSTGRES_PASSWORD: ${ATUEL_TEST_PASSWORD:?Definir ATUEL_TEST_PASSWORD en el entorno}
    ports:
      - "${ATUEL_TEST_PORT:-55441}:5432"
    volumes:
      - atuel_pg16_carga_test_data:/var/lib/postgresql/data
volumes:
  atuel_pg16_carga_test_data:
